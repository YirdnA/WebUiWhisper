{% extends "base.html" %}
{% block title %}Upload — WebUiWhisper{% endblock %}
{% block content %}
<header>
  <h2>Upload audio</h2>
  <p class="muted">
    Files land in <code>/calls/</code> and the watcher picks them up.
    Allowed: WAV / MP3 / FLAC / OGG / M4A / MP4 / WebM / AAC, up to {{ max_upload_mb }} MB.
  </p>
</header>
<form method="post" enctype="multipart/form-data" action="/upload" class="upload-form">
  <input type="hidden" name="{{ csrf_field_name() }}" value="{{ request.state.csrf_token }}">

  <label class="drop-zone" id="drop-zone">
    <span class="drop-zone-text">Drop a file here, or click to pick.</span>
    <input id="audio-file" type="file" name="file" required
           accept=".wav,.mp3,.flac,.ogg,.m4a,.mp4,.webm,.aac,audio/*,video/mp4,video/webm">
  </label>

  <label for="model-select">Model
    <select id="model-select" name="model">
      <option value="auto" selected>auto (watcher default)</option>
      {% for m in allowed_models %}
        <option value="{{ m }}">{{ m }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Queue for transcription</button>
</form>
<script src="/static/drop-zone.js" defer></script>
{% endblock %}
