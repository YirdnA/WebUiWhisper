{% if items %}
<table class="transcripts striped">
  <thead>
    <tr><th>File</th><th class="num">Size (MB)</th><th>Modified</th></tr>
  </thead>
  <tbody>
    {% for it in items %}
    <tr>
      <td class="filename">{{ it.name }}</td>
      <td class="num">{{ "%.1f"|format(it.size / 1024 / 1024) }}</td>
      <td>{{ it.mtime | fmt_ts }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>Queue is empty.</p>
{% endif %}
