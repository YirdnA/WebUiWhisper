# Apache reverse-proxy vhost for WebUiWhisper.
#
# Initial state: HTTP only. After this file is enabled and apache reloaded,
# run `sudo certbot --apache -d whisper.macroscop.org --redirect` — certbot
# will write a sibling `whisper.macroscop.org-le-ssl.conf` with the :443
# SSL block and append an HTTP→HTTPS redirect rule to the bottom of this file.

<VirtualHost *:80>
    ServerName whisper.macroscop.org
    ServerAdmin webmaster@macroscop.org

    # SSE / long-polling friendliness for the Tier B/C live log + progress streams.
    Timeout 600
    ProxyTimeout 600

    # 500 MB upload ceiling (matches the upstream whisper API).
    LimitRequestBody 524288000

    # Hardening response headers (the app sets these too — defence in depth).
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

    # Basic auth gate — Tier C replaces this with app-level login.
    <Location />
        AuthType Basic
        AuthName "WebUiWhisper"
        AuthUserFile /etc/apache2/.htpasswd-whisper
        Require valid-user

        # Forward the authenticated username to the app, which trusts the
        # `Remote-User` header (see TRUST_REMOTE_USER in .env).
        RequestHeader set Remote-User %{REMOTE_USER}s
    </Location>

    # Reverse proxy to the local FastAPI server.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    # Tell the backend it's behind HTTPS so it generates correct absolute URLs
    # (only meaningful once certbot has wired up :443).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog  ${APACHE_LOG_DIR}/whisper.macroscop.org-error.log
    CustomLog ${APACHE_LOG_DIR}/whisper.macroscop.org-access.log combined
</VirtualHost>
